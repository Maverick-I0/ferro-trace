[package]
name = "ferro-trace-core"
version = "0.0.1"
edition = "2021"
description = "Local-first static analysis, code-excerpt extraction, and stack-trace mapping engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.95"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.3"

# Tree-sitter core & language grammars
tree-sitter = "0.24.4"
tree-sitter-javascript = "0.23.1"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.23.4"

[profile.release]
# Optimize for small WASM binary size and fast execution
opt-level = "s"
lto = true
codegen-units = 1
